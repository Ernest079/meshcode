<!-- size: 512x256 -->
<!-- Game UI kit (HTML + CSS) — techniques: gradients, inset shadows and borders as the only "art";
     bars driven by a CSS custom property (--fill). Rendered to PNG through SVG foreignObject:
     use system fonts and keep images inline (data: URLs). -->
<style>
  .kit { width: 512px; height: 256px; padding: 22px; box-sizing: border-box; font-family: system-ui, sans-serif; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 22px; align-content: start; }
  .button { height: 56px; border-radius: 14px; border: 3px solid #1f1a3a; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; letter-spacing: 1px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.25), inset 0 3px 0 rgba(255, 255, 255, 0.35), 0 5px 0 #1f1a3a; }
  .play { background: linear-gradient(#5ee07a, #23a046); }
  .quit { background: linear-gradient(#ff7a6b, #d4352b); }
  .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; }
  .icon { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #1f1a3a; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; }
  .track { flex: 1; height: 26px; border-radius: 13px; border: 3px solid #1f1a3a; background: #2b2545; overflow: hidden; position: relative; box-shadow: inset 0 4px 0 rgba(0, 0, 0, 0.35); }
  .fill { height: 100%; width: calc(var(--fill) * 100%); border-radius: 10px; box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.2), inset 0 4px 0 rgba(255, 255, 255, 0.35); }
  .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 39px, rgba(0, 0, 0, 0.25) 39px 42px); }
  .hp .fill { background: linear-gradient(#ff8a7a, #e0303a); }
  .hp .icon { background: #e0303a; }
  .mp .fill { background: linear-gradient(#8ab8ff, #3466e0); }
  .mp .icon { background: #3466e0; }
</style>
<div class="kit">
  <div class="button play">PLAY</div>
  <div class="button quit">QUIT</div>
  <div class="bar hp" style="--fill: 0.72"><div class="icon">+</div><div class="track"><div class="fill"></div><div class="ticks"></div></div></div>
  <div class="bar mp" style="--fill: 0.45"><div class="icon">✦</div><div class="track"><div class="fill"></div><div class="ticks"></div></div></div>
</div>
